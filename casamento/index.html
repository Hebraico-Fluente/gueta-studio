<style>
:root{
  --ivory:#FAF6F0; --cream:#F2EBE0; --sand:#E6DCCD; --ink:#2E2A26; --soft:#5C554D; --muted:#8E857A;
  --gold:#B8936A; --gold-d:#9A7651; --sage:#7F8E74;

}
[dir=rtl]{--serif:"Frank Ruhl Libre","Cormorant Garamond",serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}

a{color:inherit}

:focus-visible{outline:1.5px solid var(--gold);outline-offset:4px}
.wrap{width:min(1140px,100%);margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{font-family:var(--serif);font-weight:300;margin:0;letter-spacing:.005em;text-wrap:balance}
h2{font-size:clamp(40px,5.4vw,64px);line-height:1.05}
h2 em,h1 em{font-style:italic;color:var(--gold-d)}
p{margin:0;text-wrap:pretty}
.label{display:inline-flex;align-items:center;gap:14px;font:400 12px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold-d)}

.orn{display:block;width:120px;height:14px;margin:26px auto;color:var(--gold)}
.center{text-align:center}

.lead{max-width:34em;color:var(--soft);font-size:clamp(16px,1.4vw,18.5px);margin-top:20px}

/* topo */
.nav{position:fixed;inset:0 0 auto;z-index:40;transition:background .45s var(--ease),box-shadow .45s}
.nav .wrap{display:flex;align-items:center;gap:26px;height:72px}
.mono{font:italic 400 28px/1 var(--serif);color:#fff;text-decoration:none;transition:color .4s}
.nav ul{display:flex;gap:26px;margin:0 auto;padding:0;list-style:none}
.nav ul a{font:400 12px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:rgba(255,255,255,.85);transition:color .3s}

.langs{display:flex;gap:2px;margin-inline-start:auto;padding:3px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px)}

.langs button[aria-pressed=true]{background:#fff;color:var(--ink)}
.nav.solid{background:rgba(250,246,240,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(46,42,38,.07)}
.nav.solid .mono{color:var(--ink)}
.nav.solid ul a{color:var(--soft)}
.nav.solid .langs{background:var(--cream)}
.nav.solid .langs button{color:var(--soft)}
.nav.solid .langs button[aria-pressed=true]{background:var(--ink);color:#fff}
@media (hover:hover){.nav ul a:hover{color:var(--gold)}}
@media (max-width:900px){.nav ul{display:none}}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 30px;border:1px solid currentColor;border-radius:999px;background:transparent;font:400 12.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .35s var(--ease),color .35s,border-color .35s,transform .2s var(--ease)}

.btn:active{transform:scale(.97)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}

.btn.light{color:#fff;border-color:rgba(255,255,255,.65)}
.btn.light.fill{background:#fff;color:var(--ink);border-color:#fff}
@media (hover:hover){.btn.light:hover{background:#fff;color:var(--ink)}}

/* hero */
.hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden;isolation:isolate}
.hero .bg{position:absolute;inset:0;z-index:-2}
.hero .bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);animation:settle 3s var(--ease) forwards}
@keyframes settle{to{transform:scale(1)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(30,26,22,.35),rgba(30,26,22,.2) 40%,rgba(30,26,22,.62))}

.hero .label{color:#fff;opacity:0;animation:up 1.4s .2s var(--ease) forwards}
.hero h1{margin:26px 0 8px;font-size:clamp(64px,11vw,150px);line-height:.95;font-style:italic;opacity:0;animation:up 1.4s .35s var(--ease) forwards}
.hero h1 span{display:inline-block;font-style:normal;font-size:.55em;vertical-align:.18em;margin:0 .12em;color:#F1DCC0}
.hero .date{font:300 clamp(18px,2vw,23px)/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:0;animation:up 1.4s .5s var(--ease) forwards}

.hero .city{margin-top:6px;font:italic 300 22px/1.4 var(--serif);color:rgba(255,255,255,.85);opacity:0;animation:up 1.4s .55s var(--ease) forwards}
.cd{display:flex;justify-content:center;gap:clamp(10px,2vw,18px);margin:42px 0 40px;opacity:0;animation:up 1.4s .7s var(--ease) forwards}
.cd div{width:clamp(70px,9vw,92px);padding:14px 0 12px;border:1px solid rgba(255,255,255,.4);border-radius:14px;background:rgba(255,255,255,.08);backdrop-filter:blur(6px)}
.cd b{display:block;font:300 clamp(30px,3.6vw,42px)/1 var(--serif);font-variant-numeric:tabular-nums}
.cd small{display:block;margin-top:6px;font:400 10.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.8)}

.hero .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;opacity:0;animation:up 1.4s .85s var(--ease) forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.sec{padding:clamp(90px,12vw,150px) 0}
.cream{background:var(--cream)}

/* história */
.story{display:grid;gap:clamp(50px,7vw,90px);margin-top:clamp(50px,7vw,80px)}
.st{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,6vw,80px);align-items:center}
.st:nth-child(even) figure{order:2}
.st figure{margin:0;overflow:hidden;border-radius:200px 200px 6px 6px;aspect-ratio:4/5}
.st img{width:100%;height:100%;object-fit:cover}
.st .yr{font:italic 300 clamp(54px,6vw,80px)/1 var(--serif);color:var(--gold)}
.st h3{font-size:clamp(30px,3vw,40px);margin:10px 0 14px}
.st p{color:var(--soft);max-width:26em}
@media (max-width:760px){.st{grid-template-columns:minmax(0,1fr)}.st:nth-child(even) figure{order:0}.st figure{max-width:420px;aspect-ratio:4/4.4}}

/* o grande dia */
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,3vw,30px);margin-top:clamp(44px,6vw,70px)}
.place{background:var(--ivory);border-radius:6px;overflow:hidden;box-shadow:0 30px 60px -40px rgba(46,42,38,.4)}
.place figure{margin:0;aspect-ratio:16/10;overflow:hidden}
.place figure img{width:100%;height:100%;object-fit:cover}
.place .bd{padding:clamp(26px,3vw,38px)}
.place small{font:400 12px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-d)}
[dir=rtl] .place small{letter-spacing:.04em;font-size:14px}
.place h3{font-size:clamp(32px,3.2vw,42px);margin:12px 0 4px}
.place .t{font:italic 300 26px/1.3 var(--serif);color:var(--gold-d)}
.place p{color:var(--soft);margin-top:12px}
.place .btn{margin-top:22px;min-height:46px;padding:0 22px;font-size:11.5px}
.dress{margin-top:clamp(30px,4vw,44px);display:flex;flex-wrap:wrap;justify-content:center;gap:10px 30px;color:var(--soft)}
.dress b{font-weight:500;color:var(--ink)}
@media (max-width:760px){.places{grid-template-columns:minmax(0,1fr)}}

/* rsvp */
.rsvp{position:relative;isolation:isolate;overflow:hidden}
.rsvp .bg{position:absolute;inset:0;z-index:-2}
.rsvp .bg img{width:100%;height:100%;object-fit:cover}
.rsvp::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(250,246,240,.88)}
.form{max-width:640px;margin:clamp(40px,5vw,56px) auto 0;padding:clamp(28px,4vw,48px);background:var(--ivory);border-radius:8px;box-shadow:0 40px 80px -50px rgba(46,42,38,.5);display:grid;gap:18px}
.form label{display:grid;gap:7px;font:400 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
[dir=rtl] .form label{letter-spacing:0;font-size:14px}
.in{width:100%;min-height:52px;padding:13px 16px;border:1px solid var(--sand);border-radius:8px;background:#fff;font:300 16px/1.4 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink);transition:border-color .3s}
.in:focus{outline:none;border-color:var(--gold)}
textarea.in{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.going{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.going input{position:absolute;opacity:0;width:1px;height:1px}
.going span{display:grid;place-items:center;min-height:52px;padding:8px 12px;border:1px solid var(--sand);border-radius:8px;background:#fff;font:400 15px/1.3 var(--sans);letter-spacing:0;text-transform:none;color:var(--soft);text-align:center;cursor:pointer;transition:all .3s}
.going input:checked+span{border-color:var(--ink);background:var(--ink);color:#fff}
.going input:focus-visible+span{outline:1.5px solid var(--gold);outline-offset:3px}

.priv{margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--muted);text-align:center}
.err{min-height:1.2em;color:#9E3B2C;font-size:14px;text-align:center}
.done{text-align:center;padding:20px 0}
.done b{display:block;font:italic 300 36px/1.2 var(--serif);margin-bottom:10px}
.done small{display:block;margin-top:14px;color:var(--muted);font-size:13px}
.done[hidden],.form[hidden]{display:none}

/* presentes */
.gifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,22px);margin-top:clamp(44px,6vw,64px)}
.gift{display:flex;flex-direction:column;gap:6px;padding:28px 26px;background:var(--ivory);border:1px solid var(--sand);border-radius:8px;transition:transform .5s var(--ease),box-shadow .5s}

.gift i{font-style:normal;font-size:26px}
.gift h3{font-size:25px;line-height:1.2;margin-top:6px}
.gift .v{font:italic 300 28px/1 var(--serif);color:var(--gold-d);margin:6px 0 16px}
.gift .btn{margin-top:auto;align-self:flex-start;min-height:44px;padding:0 20px;font-size:11px}
@media (max-width:900px){.gifts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.gifts{grid-template-columns:minmax(0,1fr);gap:10px}.gift{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:16px 16px}.gift i{grid-row:1/3;font-size:24px}.gift h3{font-size:21px;margin:0}.gift .v{font-size:22px;margin:0}.gift .btn{grid-column:3;grid-row:1/3;margin:0;align-self:center;padding:0 14px}}

.direct{max-width:640px;margin:34px auto 0;padding:16px 22px;border-radius:999px;background:var(--cream);text-align:center;font-size:15px;color:var(--soft)}
@media (max-width:520px){.direct{border-radius:14px}}
/* modal pix */
dialog{width:min(440px,100% - 28px);border:0;border-radius:12px;padding:0;background:var(--ivory);color:var(--ink);box-shadow:0 40px 90px -30px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(46,42,38,.5);backdrop-filter:blur(3px)}
.dlg{padding:34px 30px 28px;text-align:center}
.dlg h3{font-size:34px}
.dlg .g{margin-top:6px;color:var(--soft)}
.dlg .v{font:italic 300 40px/1.1 var(--serif);color:var(--gold-d);margin:14px 0 20px}
.key{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border:1px dashed var(--gold);border-radius:999px;background:#fff;text-align:start}
[dir=rtl] .key{padding:6px 16px 6px 6px}
.key small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.key code{font:400 15px/1.3 var(--sans);overflow-wrap:anywhere}
.key div{flex:1;min-width:0}
.key .btn{min-height:42px;padding:0 16px;font-size:10.5px}
.dlg p.n{margin-top:16px;font-size:14px;color:var(--muted)}
.dlg .x{margin-top:18px;border:0;background:none;color:var(--soft);text-decoration:underline;cursor:pointer;font-size:14px}

/* galeria */
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(150px,18vw,260px);gap:clamp(8px,1.2vw,14px);margin-top:clamp(40px,5vw,60px)}
.gal figure{margin:0;overflow:hidden;border-radius:4px;background:var(--sand)}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
@media (hover:hover){.gal figure:hover img{transform:scale(1.05)}}
.gal .t2{grid-row:span 2}.gal .w2{grid-column:span 2}
@media (max-width:720px){.gal{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(130px,40vw,220px)}}

/* faq */
.faq{max-width:760px;margin:clamp(40px,5vw,56px) auto 0}
.faq details{border-top:1px solid var(--sand)}
.faq details:last-child{border-bottom:1px solid var(--sand)}
.faq summary{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 2px;cursor:pointer;list-style:none;font:400 clamp(22px,2.2vw,27px)/1.3 var(--serif)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:300 30px/1 var(--sans);color:var(--gold);transition:transform .3s var(--ease)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 2px 24px;color:var(--soft);max-width:40em}

/* fim */
.end{position:relative;padding:clamp(110px,14vw,170px) 0;text-align:center;color:#fff;isolation:isolate;overflow:hidden}
.end .bg{position:absolute;inset:0;z-index:-2}
.end .bg img{width:100%;height:100%;object-fit:cover}
.end::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(30,26,22,.55)}
.end h2{font-style:italic;font-size:clamp(52px,8vw,100px)}
.end p{margin-top:16px;color:rgba(255,255,255,.85);letter-spacing:.14em;text-transform:uppercase;font-size:14px}
footer{padding:30px 0 40px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--gold-d)}
.badge{position:fixed;inset-inline-start:14px;bottom:14px;z-index:45;padding:8px 14px;border-radius:999px;background:rgba(46,42,38,.82);color:#F2EBE0;font:400 11.5px/1 var(--sans);letter-spacing:.08em;backdrop-filter:blur(8px)}
.badge a{color:#E8C9A4;text-decoration:none}

.rv{opacity:0;transform:translateY(24px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.rv.shown{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.rv,.hero .label,.hero h1,.hero .date,.hero .city,.cd,.hero .acts{opacity:1;transform:none}}
@media (max-width:420px){.row2{grid-template-columns:1fr 1fr}.btn{padding:0 22px;letter-spacing:.14em}}
</style>

@keyframes stdUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

const LOC = { pt:"pt-BR", es:"es", en:"en-US", it:"it-IT", he:"he-IL" };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let lang = new URLSearchParams(location.search).get("lang") || localStorage.getItem("wed-lang") || "pt";
if (!T[lang]) lang = "pt";
const t = k => T[lang][k] ?? T.pt[k] ?? "";
const when = new Date(WEDDING.date);
const fmt = (d, o) => new Intl.DateTimeFormat(LOC[lang], { timeZone: "America/Sao_Paulo", ...o }).format(d);

function apply(){
  const he = lang === "he";
  document.documentElement.lang = LOC[lang]; document.documentElement.dir = he ? "rtl" : "ltr";
  $$("[data-t]").forEach(el => { const v = t(el.dataset.t).replace("{deadline}", fmt(new Date(WEDDING.rsvpDeadline + "T12:00:00-03:00"), { day:"numeric", month:"long" })); el.hasAttribute("data-html") ? el.innerHTML = v : el.textContent = v; });
  $$("[data-ph]").forEach(el => el.placeholder = t(el.dataset.ph));
  $$('[data-date="long"]').forEach(el => el.textContent = fmt(when, { weekday:"long", day:"numeric", month:"long", year:"numeric" }));
  $$('[data-date="short"]').forEach(el => el.textContent = fmt(when, { day:"2-digit", month:"2-digit", year:"numeric" }));
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  renderGifts();
}
$$("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; localStorage.setItem("wed-lang", lang); apply(); if (typeof applyExtras === "function") applyExtras(); }));

/* contagem regressiva */
function tick(){
  let s = Math.max(0, Math.floor((when - Date.now()) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60;
  $('[data-cd="d"]').textContent = d; $('[data-cd="h"]').textContent = String(h).padStart(2, "0");
  $('[data-cd="m"]').textContent = String(m).padStart(2, "0"); $('[data-cd="s"]').textContent = String(s).padStart(2, "0");
}
tick(); setInterval(tick, 1000);

/* agenda e mapa */
const z = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
$("#saveDate").href = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("Casamento Ana & Pedro") +
  "&dates=" + z(when) + "/" + z(new Date(when.getTime() + 7 * 3600e3)) + "&ctz=America/Sao_Paulo&location=" + encodeURIComponent(WEDDING.place);
$$("[data-map]").forEach(a => a.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(WEDDING.place));

/* presença */
const form = $("#rsvpForm");
form.addEventListener("change", () => { const vai = form.vai.value === "sim"; $("#qty").hidden = !vai; $("#diet").hidden = !vai; $("#song").hidden = !vai; });
form.addEventListener("submit", e => {
  e.preventDefault(); $("#err").textContent = "";
  const nome = form.nome.value.trim(); if (nome.length < 2) { $("#err").textContent = t("err_name"); return form.nome.focus(); }
  const vai = form.vai.value === "sim";
  if (WEDDING.whatsapp) {
    const msg = [`Confirmação de presença · Ana & Pedro`, `Nome: ${nome}`, vai ? `Vai: sim · adultos ${form.adultos.value} · crianças ${form.criancas.value}` : "Vai: não",
      form.restricao.value && vai ? `Restrição: ${form.restricao.value}` : "", form.musica.value && vai ? `Música: ${form.musica.value}` : "", form.msg.value ? `Mensagem: ${form.msg.value}` : ""].filter(Boolean).join("\n");
    window.open(`https://wa.me/${WEDDING.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
  }
  $("#doneT").textContent = t(vai ? "done_yes" : "done_no");
  $("#done small").hidden = !!WEDDING.whatsapp;
  form.hidden = true; $("#done").hidden = false;
});

/* presentes + pix */
const brl = v => "\u2066R$\u00a0" + v.toLocaleString(LOC[lang]) + "\u2069";
function renderGifts(){
  $("#gifts").innerHTML = WEDDING.gifts.map((g, i) => `<article class="gift rv shown"><i aria-hidden="true">${g.i}</i><h3>${t(g.k)}</h3><span class="v">${g.v ? brl(g.v) : t("free")}</span><button class="btn line" type="button" data-gift="${i}">${t("give")}</button></article>`).join("");
}
$("#gifts").addEventListener("click", e => {
  const b = e.target.closest("[data-gift]"); if (!b) return; const g = WEDDING.gifts[+b.dataset.gift];
  $("#pixG").textContent = t(g.k); $("#pixV").textContent = g.v ? brl(g.v) : t("free"); $("#pixKey").textContent = WEDDING.pix;
  $("#copy").textContent = t("copy"); $("#pix").showModal();
});
$("#copy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(WEDDING.pix); } catch (e) {} $("#copy").textContent = t("copied"); });
$("#pixClose").addEventListener("click", () => $("#pix").close());
$("#pix").addEventListener("click", e => { if (e.target.id === "pix") $("#pix").close(); });

/* topo + entrada suave */
const onScroll = () => $("#nav").classList.toggle("solid", scrollY > innerHeight * .8);
addEventListener("scroll", onScroll, { passive: true }); onScroll();
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("shown"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -10% 0px" });
$$(".rv").forEach((el, i) => { el.style.transitionDelay = (i % 3) * 100 + "ms"; io.observe(el); });
apply();

/* ===== novidades: save the date, convite pessoal, mesa, música ===== */
const q = new URLSearchParams(location.search);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const inv = WEDDING.invites[q.get("c") || ""];
function applyExtras(){
  $$('[data-date="dots"]').forEach(el => el.textContent = fmt(when, { day:"2-digit", month:"2-digit", year:"numeric" }).replace(/\//g, " · "));
  if (inv) {
    document.body.classList.add("personal");
    $("#hi").textContent = t("hi").replace("{name}", inv.name);
    $("#invHi").textContent = t("hi").replace("{name}", inv.name);
    $("#invSeats").textContent = t("inv_seats").replace("{n}", inv.seats).replace("{s}", lang === "en" ? (inv.seats > 1 ? "people" : "person") : (inv.seats > 1 ? "s" : ""));
    $("#invGo").textContent = inv.seats > 1 ? t("inv_go").replace("{n}", inv.seats) : t("inv_go1");
  }
}
if (inv) {
  form.nome.value = inv.name;
  [...form.adultos.options].forEach(o => o.hidden = +o.value > inv.seats);
  form.adultos.value = String(Math.min(inv.seats, 4));
  $("#invGo").addEventListener("click", () => { form.vai.value = "sim"; form.dispatchEvent(new Event("change")); form.requestSubmit(); $("#rsvp").scrollIntoView({ behavior: "smooth", block: "start" }); });
}
/* encontre sua mesa */
const salao = $("#salao");
salao.insertAdjacentHTML("beforeend", WEDDING.tables.map(m => `<i data-m="${m.n}" style="left:${m.x}%;top:${m.y}%">${m.n}</i>`).join(""));
$("#mesaForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = norm(e.target.q.value); const res = $("#mesaRes");
  $$("#salao i").forEach(i => i.classList.remove("on"));
  if (v.length < 2) return;
  const m = WEDDING.tables.find(t2 => t2.guests.some(g => norm(g).includes(v) || v.split(" ").every(p => norm(g).includes(p))));
  res.className = "res on" + (m ? "" : " miss");
  res.innerHTML = m ? `<span>${t("mesa_hit")}</span><b>${m.n}</b><span>${m.x > 30 && m.x < 70 ? t("mesa_near") : t("mesa_far")}</span>` : t("mesa_miss");
  if (m) $(`#salao [data-m="${m.n}"]`).classList.add("on");
});
if (q.has("mesa")) addEventListener("load", () => $("#mesa").scrollIntoView());
/* save the date animado: na primeira visita (ou com ?std) */
const std = $("#std");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let seen = false; try { seen = sessionStorage.getItem("wed-std") === "1"; } catch (e) {}
function closeStd(){ std.classList.add("out"); document.documentElement.style.overflow = ""; try { sessionStorage.setItem("wed-std", "1"); } catch (e) {} }
if (reduce || (seen && !q.has("std")) || q.has("nostd")) std.remove();
else { document.documentElement.style.overflow = "hidden"; $("#stdSkip").addEventListener("click", closeStd); setTimeout(closeStd, 4600); }
applyExtras();
</script>
</body>
</html>
